<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一页只讲一个主张</title>
<!-- STYLE-BLOCK:BEGIN · 本块是整份演示的唯一样式真源：逐页原样复制，禁止单独修改。
     换主题只改本文件的 :root，再把整块同步到所有分页，然后跑样式块校验。 -->
<style>
:root{
  /* 设计令牌：全演示的数值只在这里出现一次 */
  --bg:#ffffff;
  --ink:#1a1f2b;
  --ink-soft:#5b6472;
  --accent:#2f6bff;
  --accent-soft:#eef3ff;
  --line:#e3e7ee;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --fs-cover:clamp(40px,5.4vw,76px);
  --fs-title:clamp(32px,4.2vw,60px);
  --fs-lead:clamp(18px,2vw,28px);
  --fs-body:clamp(16px,1.5vw,22px);
  --fs-small:clamp(13px,1.1vw,17px);
  --space:clamp(24px,4.5vw,72px);
  --gap:clamp(12px,1.8vw,28px);
  --maxw:1080px;
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;}
/* 显式背景：分页经 iframe + transform 合成缩略图时，根背景若为透明会透出深色面板底，
   表现为「缩略图全黑」。这一行必须保留。 */
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);}
body{color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.6;
     -webkit-font-smoothing:antialiased;}
/* 所有页共用同一骨架与同一垂直对齐：内容多少不会让标题在页间上下跳 */
.slide{display:flex;flex-direction:column;justify-content:center;gap:var(--gap);
       width:100%;max-width:var(--maxw);min-height:100vh;margin:0 auto;padding:var(--space);}
.slide-head{display:flex;flex-direction:column;gap:calc(var(--gap)/2);}
.slide-head::after{content:"";display:block;width:56px;height:4px;border-radius:2px;
                   background:var(--accent);margin-top:calc(var(--gap)/2);}
.kicker{margin:0;font-size:var(--fs-small);letter-spacing:.12em;color:var(--accent);}
.slide-head h1{margin:0;font-size:var(--fs-title);line-height:1.18;letter-spacing:-.01em;font-weight:700;}
.lead{margin:0;font-size:var(--fs-lead);line-height:1.45;color:var(--ink-soft);}
.slide-body{display:flex;flex-direction:column;gap:var(--gap);}

/* ---- 受控组件白名单：只能用下面这些 class，不新造、不写行内 style ---- */
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:calc(var(--gap)/2);}
.points li{position:relative;padding-left:1.4em;font-size:var(--fs-body);}
.points li::before{content:"";position:absolute;left:0;top:.65em;width:.5em;height:.5em;
                   border-radius:50%;background:var(--accent);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap);}
.card{padding:var(--gap);border:1px solid var(--line);border-radius:var(--radius);background:var(--accent-soft);}
.card h2{margin:0 0 .4em;font-size:var(--fs-lead);line-height:1.3;}
.card p{margin:0;font-size:var(--fs-small);color:var(--ink-soft);}
.figure{margin:0;padding:var(--gap);border:1px solid var(--line);border-radius:var(--radius);text-align:center;}
.figure svg{max-width:100%;height:auto;}
.figure figcaption{margin-top:.6em;font-size:var(--fs-small);color:var(--ink-soft);}
.quote{margin:0;padding:var(--gap);border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;
       background:var(--accent-soft);font-size:var(--fs-lead);}
.steps{margin:0;padding:0;list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:calc(var(--gap)/2);}
.steps li{counter-increment:step;display:flex;gap:.8em;align-items:flex-start;}
.steps li::before{content:counter(step);flex:0 0 auto;width:1.8em;height:1.8em;border-radius:50%;
                  background:var(--accent);color:#fff;font-size:var(--fs-small);
                  display:flex;align-items:center;justify-content:center;}
table.data{width:100%;border-collapse:collapse;font-size:var(--fs-small);}
table.data th,table.data td{padding:.6em .8em;border-bottom:1px solid var(--line);text-align:left;}
table.data th{color:var(--ink-soft);font-weight:600;}
/* ------------------------------------------------------------------ */

.slide-foot{display:flex;justify-content:space-between;gap:var(--gap);
            border-top:1px solid var(--line);padding-top:calc(var(--gap)/2);
            font-size:var(--fs-small);color:var(--ink-soft);}
/* 角色变体：只切 data-role，不新增样式表 */
.slide[data-role="cover"]{text-align:center;align-items:center;}
.slide[data-role="cover"] .slide-head h1{font-size:var(--fs-cover);}
.slide[data-role="cover"] .slide-head::after{display:none;}
.slide[data-role="cover"] .slide-foot{border-top:0;}
.slide[data-role="section"] .slide-head h1{font-size:var(--fs-cover);}
.slide[data-role="end"]{text-align:center;align-items:center;}
</style>
<!-- STYLE-BLOCK:END -->
</head>
<body>
<!--
  分页骨架契约（复制本文件后只改下面三块文字）：
    <title>         与文件名里的页名一致
    <main>          按 data-role 选角色，填 kicker / h1 / lead / slide-body / slide-foot
    末尾 HTML 注释  写「引出下页」的一句话，供制作时对照大纲
  可用组件：<ul class="points">、<div class="grid"> + <div class="card">、
            <figure class="figure">（内联 SVG）、<blockquote class="quote">、
            <ol class="steps">、<table class="data">
  禁止：脚本标签、外部 URL 资源、行内样式属性、新造 class、写死页码。
-->
<main class="slide" data-role="content">
  <header class="slide-head">
    <p class="kicker">第二章 · 样式契约</p>
    <h1>一页只讲一个主张</h1>
    <p class="lead">上一页定下了配色，这一页把版式固定下来，后面的页就不必再各自发挥。</p>
  </header>
  <section class="slide-body">
    <ul class="points">
      <li>所有数值收敛到 :root 的令牌里，页面正文不写颜色、字号和间距。</li>
      <li>骨架与组件来自同一份模板，页与页之间只换内容，不换版式。</li>
      <li>样式块逐页原样复制，用哈希校验防止逐页漂移。</li>
    </ul>
    <div class="grid">
      <div class="card"><h2>唯一真源</h2><p>换主题只改模板，再整块同步。</p></div>
      <div class="card"><h2>自带样式</h2><p>单文件发出去也不会掉版式。</p></div>
    </div>
  </section>
  <footer class="slide-foot">
    <span class="doc">htmlppt 演示</span>
    <span class="chapter">样式契约</span>
  </footer>
</main>
<!-- 引出下页：下一页说明这些 class 如何被校验，确保不会逐页漂移。 -->
</body>
</html>
